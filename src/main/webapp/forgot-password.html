<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot Password | ClauseLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
</head>
<body>
  <div class="auth">
    <aside class="auth-side">
      <a class="brand" href="index.html" style="text-decoration:none; display:inline-flex; align-items:center; gap:10px;">
        <img src="assets/img/logo-icon.png" alt="ClauseLens" style="height:38px; width:auto; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.25));">
        <span style="color:#FFFFFF; font-size:22px; font-weight:800;">Clause<strong>Lens</strong></span>
      </a>
      <div>
        <span class="tag" style="background:rgba(255,255,255,0.2); color:#FFFFFF; margin-bottom:12px;">Security Verification</span>
        <h1>Account Recovery</h1>
        <p>Enter your account email to receive secure password reset instructions.</p>
      </div>
      <p style="font-size:13px; color:#EDE8FF;">Enterprise-grade password hashing with BCrypt.</p>
    </aside>

    <main class="auth-main">
      <form class="form" id="forgot-form" onsubmit="handleForgot(event)">
        <h2>Reset Password</h2>
        <p class="sub">Enter your email address to initiate recovery.</p>
        
        <div class="msg" id="forgot-msg" role="alert"></div>

        <div class="field">
          <label for="email">Account Email</label>
          <input id="email" type="email" required placeholder="name@company.com">
        </div>

        <button class="btn btn-green" type="submit" id="btn-submit" style="width:100%;">Send Reset Link</button>

        <p class="alt-link">
          Remember your credentials? <a href="freelancer-login.html">Sign In</a>
        </p>
      </form>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script>
    async function handleForgot(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const msg = document.getElementById('forgot-msg');
      const btn = document.getElementById('btn-submit');

      btn.disabled = true;
      btn.textContent = 'Verifying...';

      try {
        const res = await API.post('api/forgot-password', { email });
        msg.className = 'msg ok';
        msg.textContent = res.message;
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    }
  </script>
</body>
</html>
