<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register Company — ClauseLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .role-pill-btn {
      flex: 1;
      text-align: center;
      padding: 9px 0;
      border-radius: var(--r-pill);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      border: none;
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s;
    }
    .role-pill-btn.active {
      background: #FFFFFF;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(104, 71, 232, 0.15);
    }
    .pw-wrap {
      position: relative;
    }
    .pw-wrap input {
      width: 100%;
      height: 42px;
      padding: 9px 38px 9px 13px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }
    .pw-wrap input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(104, 71, 232, 0.12);
    }
    .pw-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      display: grid;
      place-items: center;
    }
    .pw-toggle:hover { color: var(--primary); }
    .form-input-clean {
      width: 100%;
      height: 42px;
      padding: 9px 13px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      font-size: 14px;
      background: #FFFFFF;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }
    .form-input-clean:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(104, 71, 232, 0.12);
    }
    .form-label-clean {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 5px;
    }
  </style>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
</head>
<body style="background: #F7F5FF; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif;">

  <!-- Centered Brand Logo -->
  <a class="brand" href="index.html" style="margin-bottom: 22px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">
    <img src="assets/img/logo.png" alt="ClauseLens" style="height: 72px; width: auto; filter: drop-shadow(0 8px 24px rgba(104,71,232,0.28)); transition: transform 0.25s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
  </a>

  <!-- Floating Centered Card (Unified 540px Standard) -->
  <div class="auth-card-theme" style="max-width: 540px; width: 100%; margin: 0 auto; box-shadow: 0 24px 60px rgba(23, 21, 54, 0.14); border-radius: 22px; padding: 24px 28px; background: #FFFFFF; box-sizing: border-box;">
    
    <!-- Top Pill Switcher -->
    <div style="display: flex; background: var(--lavender-subtle); padding: 4px; border-radius: var(--r-pill); margin-bottom: 16px;">
      <a href="register-freelancer.html" class="role-pill-btn">Freelancer</a>
      <a href="register-company.html" class="role-pill-btn active">Company</a>
    </div>

    <h2 style="font-size: 24px; font-weight: 800; color: var(--text); margin-bottom: 4px; letter-spacing: -0.02em;">Create Company Profile</h2>
    <p class="sub" style="color: var(--text-muted); font-size: 13.5px; margin-bottom: 16px; line-height: 1.4;">Set up your profile to post jobs and analyze client contracts.</p>

    <form class="form" data-form="company" data-next="company-login.html" novalidate style="margin: 0; padding: 0; border: none; box-shadow: none; background: transparent; max-width: 100%;">
      <div class="msg" role="alert" style="margin-bottom: 10px;"></div>

      <!-- 2-Column Balanced Grid: 3 rows x 2 cols = 6 necessary fields + Secondary Domains -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-bottom: 14px;">
        <div class="field" style="margin: 0;">
          <label for="companyName" class="form-label-clean">Company Name</label>
          <input id="companyName" name="companyName" required maxlength="150" placeholder="e.g. Apex Software" class="form-input-clean">
        </div>

        <div class="field" style="margin: 0;">
          <label for="email" class="form-label-clean">Work Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required placeholder="contact@apexsoftware.com" class="form-input-clean">
        </div>

        <div class="field" style="margin: 0;">
          <label for="password" class="form-label-clean">Password</label>
          <div class="pw-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" required placeholder="8+ chars">
            <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('password')" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="field" style="margin: 0;">
          <label for="country" class="form-label-clean">Country</label>
          <input id="country" name="country" required maxlength="80" placeholder="United States, India..." class="form-input-clean">
        </div>

        <div class="field" style="margin: 0;">
          <label for="industry" class="form-label-clean">Industry</label>
          <select id="industry" name="industry" required class="form-input-clean">
            <option value="Technology & SaaS">Technology &amp; SaaS</option>
            <option value="FinTech">FinTech</option>
            <option value="Artificial Intelligence">Artificial Intelligence</option>
            <option value="E-Commerce">E-Commerce</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Digital Marketing">Digital Marketing</option>
            <option value="Consulting">Consulting</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field" style="margin: 0;">
          <label for="contactPerson" class="form-label-clean">Contact Person</label>
          <input id="contactPerson" name="contactPerson" required maxlength="120" placeholder="e.g. Sarah Jenkins" class="form-input-clean">
        </div>
      </div>

      <button class="btn btn-purple" type="submit" style="width: 100%; height: 44px; padding: 10px; font-size: 15px; font-weight: 700; border-radius: 12px; justify-content: center; box-shadow: 0 6px 20px rgba(104, 71, 232, 0.25);">
        Complete Registration &rarr;
      </button>

      <div class="alt-link" style="text-align: center; margin-top: 14px; font-size: 13.5px; color: var(--text-muted);">
        Already have an account? <a href="company-login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Sign In</a>
      </div>

      <div style="margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); text-align: center;">
        <a href="index.html" style="font-size: 13px; color: var(--text-muted); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
          &larr; Back to ClauseLens Home
        </a>
      </div>
    </form>
  </div>

  <script src="js/auth.js"></script>
  <script>
    function togglePasswordVisibility(fieldId) {
      const field = document.getElementById(fieldId);
      if (!field) return;
      field.type = field.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
